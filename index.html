<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>在庫移管</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
  <style>
    :root { --bd:#d6d9e0; --bg:#f4f6f9; --pri:#1763d6; --pri2:#0f4ea8; --ok:#127a3e; --ng:#c0362c; --mut:#5b6472; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,system-ui,sans-serif; color:#1c2430; background:var(--bg); }
    header { background:var(--pri2); color:#fff; padding:12px 16px; font-size:18px; font-weight:600; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:20; }
    header .who { font-size:12px; font-weight:400; opacity:.9; }
    header #switchUser { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:6px; padding:5px 10px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
    header #switchUser:hover { background:rgba(255,255,255,.28); }
    .wrap { max-width:1000px; margin:0 auto; padding:14px; }
    .card { background:#fff; border:1px solid var(--bd); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }
    label { display:block; font-size:12px; color:var(--mut); margin-bottom:4px; font-weight:600; }
    select, input[type=date], input[type=text], input[type=number] { width:100%; padding:9px 10px; border:1px solid var(--bd); border-radius:8px; font-size:15px; background:#fff; }
    .banner { padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:14px; }
    .banner.warn { background:#fff4e5; border:1px solid #f0c27a; color:#8a5a00; }
    .banner.ng { background:#fdecea; border:1px solid #f0a9a2; color:#a12820; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:7px 8px; border-bottom:1px solid #eef0f4; font-size:14px; vertical-align:middle; }
    th { color:var(--mut); font-size:12px; }
    td.no { width:32px; color:var(--mut); } td.qty { width:110px; } td.del { width:44px; text-align:center; } td.iname { color:#38414f; font-size:13px; }
    .searchbox { position:relative; }
    .qtyinput { text-align:right; }
    .suggest { position:absolute; left:0; right:0; top:100%; background:#fff; border:1px solid var(--bd); border-top:none; border-radius:0 0 8px 8px; max-height:260px; overflow:auto; z-index:30; display:none; box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .suggest div { padding:8px 10px; cursor:pointer; font-size:13px; border-top:1px solid #eef0f4; }
    .suggest div:hover { background:#eaf1fd; }
    .code { font-weight:700; color:var(--pri2); margin-right:8px; }
    .btn { border:none; border-radius:8px; padding:11px 18px; font-size:15px; font-weight:600; cursor:pointer; }
    .btn.primary { background:var(--pri); color:#fff; } .btn.primary:disabled { background:#9db8e6; cursor:not-allowed; }
    .btn.ghost { background:#eef1f6; color:#38414f; } .btn.x { background:none; color:var(--ng); font-size:18px; padding:2px 8px; }
    .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
    .result { margin-top:12px; font-size:14px; } .result.ok { color:var(--ok); } .result.ng { color:var(--ng); }
    .muted { color:var(--mut); font-size:12px; } .req::after { content:" *"; color:var(--ng); }
    /* 明細カード(2段・レスポンシブ) */
    .lrow { border:1px solid #e6e9ef; border-radius:10px; padding:8px 10px; margin-bottom:8px; background:#fff; }
    .lrow-top { display:flex; align-items:center; gap:8px; }
    .lno { color:var(--mut); font-size:13px; min-width:18px; text-align:center; }
    .lrow-top .searchbox { flex:1; }
    .lrow-bot { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; padding-left:26px; }
    .lrow .iname { font-size:13px; color:#38414f; flex:1; min-height:17px; overflow:hidden; text-overflow:ellipsis; }
    .qtybox { font-size:12px; color:var(--mut); display:flex; align-items:center; gap:6px; white-space:nowrap; }
    .qtybox .qtyinput { width:100px; text-align:right; }
    .tabs { display:flex; gap:6px; border-bottom:1px solid var(--bd); }
    .tab { border:none; background:none; padding:10px 16px; font-size:15px; font-weight:600; color:var(--mut); cursor:pointer; border-bottom:3px solid transparent; }
    .tab.active { color:var(--pri2); border-bottom-color:var(--pri); }
    #video { width:100%; max-width:340px; border-radius:10px; background:#000; display:block; }
    .camwrap { position:relative; max-width:340px; margin:0 auto; }
    .camwrap .frame { position:absolute; top:50%; left:50%; width:70%; aspect-ratio:1; transform:translate(-50%,-50%); border:2px solid #fff; border-radius:10px; box-shadow:0 0 0 2000px rgba(0,0,0,.28); pointer-events:none; }
    #signin { text-align:center; padding:40px 16px; }
  </style>
</head>
<body>
  <header>
    <span>在庫移管 <span class="who" id="who"></span></span>
    <button id="switchUser" type="button" hidden>ユーザー切替</button>
  </header>
  <div class="wrap">

    <div id="signin" class="card">
      <p>社内Googleアカウントでサインインしてください。</p>
      <div id="gbtn" style="display:inline-block"></div>
      <div id="signinMsg" class="muted" style="margin-top:10px"></div>
    </div>

    <div id="app" hidden>
      <div id="relogin" class="banner ng" hidden>
        <span>サインインの有効期限が切れました。<b>入力内容はそのまま保持しています。</b>もう一度サインインしてください。</span>
        <span id="rebtn" style="display:inline-block;margin-left:8px;vertical-align:middle"></span>
      </div>
      <div class="card">
        <div class="tabs">
          <button class="tab active" id="tabMove" type="button">在庫移管</button>
          <button class="tab" id="tabAdjust" type="button">引き落とし(消費)</button>
          <button class="tab" id="tabCheck" type="button">在庫確認</button>
          <button class="tab" id="tabCount" type="button">棚卸</button>
        </div>
        <div class="grid" id="hdrGrid" style="margin-top:12px">
          <div><label id="lblOrigin">移管元 在庫場所</label><select id="origin"></select></div>
          <div id="destWrap"><label>移管先 在庫場所</label><select id="dest"></select></div>
          <div><label id="lblDate">移管日</label><input type="date" id="tdate"></div>
          <div><label class="req">担当者(製造部)</label><select id="staff"><option value="">選択してください</option></select></div>
        </div>
        <div id="whoRow" class="muted" style="margin-top:10px;"></div>
      </div>

      <div class="card">
        <div class="bar" style="margin-top:0">
          <b>QR / バーコードをかざして読取(ライブ)</b>
          <div>
            <button class="btn primary" id="camStart" type="button">カメラ開始</button>
            <button class="btn ghost" id="camStop" type="button" hidden>停止</button>
          </div>
        </div>
        <div class="camwrap" id="camwrap" style="display:none;margin-top:10px">
          <video id="video" playsinline muted></video>
          <div class="frame"></div>
        </div>
        <div id="zoomWrap" style="display:none;justify-content:center;align-items:center;gap:8px;margin-top:8px;max-width:340px;margin-left:auto;margin-right:auto">
          <button class="btn ghost" id="torchBtn" type="button" style="display:none;padding:6px 12px">💡ライト</button>
        </div>
        <div id="scanMsg" class="muted" style="margin-top:8px"></div>
        <div id="scanPick" style="display:none;border:1px solid var(--bd);border-radius:8px;margin-top:8px;overflow:hidden"></div>
        <div class="muted" id="scanHint" style="margin-top:6px;">かざすだけで一番上の空行へ自動追加(旧コードは自動で新コードへ変換)。手入力も下の表で可能。</div>
      </div>

      <div class="card" id="entryCard">
        <div id="rows"></div>
        <div class="bar">
          <div><button class="btn ghost" id="addBtn" type="button">＋ 行を追加(5行)</button> <span class="muted" id="summary" style="margin-left:8px;"></span></div>
          <div><button class="btn ghost" id="clearBtn" type="button">全クリア</button> <button class="btn primary" id="submitBtn" type="button" disabled>決定(一括移管)</button></div>
        </div>
        <div id="result" class="result"></div>
      </div>

      <div class="card" id="checkCard" style="display:none">
        <label>在庫を確認する品目</label>
        <div class="searchbox">
          <input id="checkInput" autocomplete="off" placeholder="品目コード/名称で検索・またはカメラで読取">
          <div class="suggest" id="checkSug"></div>
        </div>
        <div id="checkResult" style="margin-top:12px"></div>
        <div class="muted" style="margin-top:6px;">現在の理論在庫(UM)を在庫場所ごとに表示します。読み取りのみで在庫は変更しません。</div>
      </div>

      <div class="card" id="countHdr" style="display:none">
        <div class="grid">
          <div><label>棚卸する在庫場所</label><select id="countPlace"></select></div>
          <div><label>カウント担当者</label><div id="counterName" class="muted" style="padding-top:8px">-</div></div>
          <div><label>カウント方式</label><label style="font-weight:400;display:flex;align-items:center;gap:8px;padding-top:6px"><input type="checkbox" id="blindToggle" checked style="width:auto"> ブラインド(システム在庫を隠す)</label></div>
        </div>
      </div>

      <div class="card" id="countCard" style="display:none">
        <div class="searchbox">
          <input id="countInput" autocomplete="off" placeholder="原材料の品目コード/名称で検索・またはカメラで読取">
          <div class="suggest" id="countSug"></div>
        </div>
        <div id="countRows" style="margin-top:10px"></div>
        <div class="bar">
          <div><span class="muted" id="countSummary"></span></div>
          <div><button class="btn ghost" id="countClear" type="button">全クリア</button></div>
        </div>
        <div class="muted" style="margin-top:6px;">原材料のみ対象。実数を入力すると差異(実数−システム)を表示します。※ 保存・承認・在庫反映は次フェーズで実装します。</div>
      </div>
    </div>
  </div>

<script>
  /* ===== 設定(この2つを埋めてください) ===== */
  var CONFIG = {
    GAS_API_URL: 'https://script.google.com/macros/s/AKfycbysFsni50z4Vi-qaDa3Di7owezI8i2JaZl3PrZUkVXdcHboMItUhdmw8pU-sIRO4oUzjA/exec',
    GOOGLE_CLIENT_ID: '952982265733-h7d6hldt8ggopotniaeocp53tv1h36vl.apps.googleusercontent.com'
  };

  var SESSION = '', SESSION_PL = null, APP_READY = false, pendingAuth_ = null, SS_KEY = 'invtrans_session';
  var LINES = [], COUNTS = [], MYINFO = {}, INIT_ROWS = 10, CONNECTED = false, timers = {}, lastScan = { code:'', t:0 }, MODE = 'move';
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);}); }
  function blankRow(){ return { itemId:'', code:'', name:'', qty:'', _cand:[] }; }
  function setMode(m){
    MODE = m;
    $('tabMove').classList.toggle('active', m==='move');
    $('tabAdjust').classList.toggle('active', m==='adjust');
    $('tabCheck').classList.toggle('active', m==='check');
    $('tabCount').classList.toggle('active', m==='count');
    var isEntry=(m==='move'||m==='adjust'), isCheck=(m==='check'), isCount=(m==='count');
    // タブごとに表示を切替(カメラの読取カードは全モード共通で使う)
    $('hdrGrid').style.display   = isEntry ? '' : 'none';
    $('whoRow').style.display    = isEntry ? '' : 'none';
    $('entryCard').style.display = isEntry ? '' : 'none';
    $('checkCard').style.display = isCheck ? '' : 'none';
    $('countHdr').style.display  = isCount ? '' : 'none';
    $('countCard').style.display = isCount ? '' : 'none';
    $('scanHint').style.display  = isEntry ? '' : 'none';
    if(isEntry){
      $('destWrap').style.display = (m==='adjust') ? 'none' : '';
      $('lblOrigin').textContent = (m==='adjust') ? '引き落とし元 在庫場所' : '移管元 在庫場所';
      $('lblDate').textContent = (m==='adjust') ? '日付' : '移管日';
      $('submitBtn').textContent = (m==='adjust') ? '決定(一括引き落とし)' : '決定(一括移管)';
      updateSubmitState();
    }
    setScanMsg(isCheck ? 'カメラで品目を読み取ると在庫を照会します。' : (isCount ? 'カメラで品目を読み取るとカウントに追加します。' : ''));
  }

  /* ===== セッション(GAS発行のHMACトークン。Google IDトークンの1時間制限を回避) ===== */
  function b64urlToJson_(b64){ try{ var p=b64.replace(/-/g,'+').replace(/_/g,'/'); while(p.length%4)p+='='; return JSON.parse(decodeURIComponent(atob(p).split('').map(function(c){return '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2);}).join(''))); }catch(e){ return null; } }
  function parseSession_(tok){ return tok ? b64urlToJson_(tok.split('.')[0]) : null; }
  function setSession_(tok){
    SESSION = tok || ''; SESSION_PL = tok ? parseSession_(tok) : null;
    try{ if(tok) localStorage.setItem(SS_KEY, tok); else localStorage.removeItem(SS_KEY); }catch(e){}
    if(SESSION_PL){ $('who').textContent = '👤 ' + (SESSION_PL.name || SESSION_PL.email || ''); }
    var sw=$('switchUser'); if(sw) sw.hidden = !tok;
  }
  function sessionAlive_(){ return !!(SESSION_PL && SESSION_PL.exp && (SESSION_PL.exp*1000 > Date.now()+60000)); }

  /* ===== GAS API 呼び出し(セッション優先。text/plainでプリフライト回避) ===== */
  function apiRaw_(action, extra){
    var body = { action: action, session: SESSION };
    if (extra) for (var k in extra) body[k] = extra[k];
    return fetch(CONFIG.GAS_API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body), redirect:'follow' })
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.session){ setSession_(j.session); } return j; });   // スライド更新を反映
  }
  function api(action, extra){
    return apiRaw_(action, extra).then(function(j){
      if(j && j.code==='AUTH'){
        return trySilentReauth_().then(function(ok){
          if(ok) return apiRaw_(action, extra);     // 無操作で再認証できたら1回だけ再試行
          handleAuthLost_(); return j;
        });
      }
      return j;
    });
  }
  /* セッション失効時: Google自動選択で“無操作”再認証を試す(数秒で諦める) */
  function trySilentReauth_(){
    return new Promise(function(resolve){
      if(!(window.google && google.accounts && google.accounts.id)){ resolve(false); return; }
      var settled=false; function settle(v){ if(settled) return; settled=true; pendingAuth_=null; resolve(v); }
      pendingAuth_ = { resolve: settle };
      try{ google.accounts.id.prompt(); }catch(e){ settle(false); return; }
      setTimeout(function(){ settle(false); }, 4000);
    });
  }
  /* 失効を検知したら: 画面は消さず入力を保持したまま、上部に再サインインを促す */
  function handleAuthLost_(){ $('relogin').hidden=false; try{ google.accounts.id.prompt(); }catch(e){} }
  function refreshInit_(){ api('init',{}).then(onInit).catch(function(){}); }
  /* ユーザー切替: セッション破棄→自動選択を止めて別アカウントでサインインし直す(共有端末・棚卸の担当交代用) */
  function switchUser_(){
    if(!confirm('ユーザーを切り替えますか？入力中の内容(移管リスト・棚卸カウント)は消えます。')) return;
    LINES=[]; for(var i=0;i<INIT_ROWS;i++) LINES.push(blankRow()); if(APP_READY) renderRows();
    COUNTS=[]; if(APP_READY) renderCounts();
    setResult('','');
    setSession_('');                                   // セッション破棄(localStorageからも削除)
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}   // 次回は自動選択せずアカウント選択させる
    $('who').textContent='';
    $('app').hidden=true; $('relogin').hidden=true; $('signin').hidden=false;
    $('signinMsg').textContent='別のアカウントでサインインしてください。';
    try{ google.accounts.id.prompt(); }catch(e){}
  }

  /* ===== Google サインイン → セッション発行 ===== */
  window.onload = function(){
    var saved=''; try{ saved=localStorage.getItem(SS_KEY)||''; }catch(e){}
    if(saved){ setSession_(saved); if(sessionAlive_()){ $('signin').hidden=true; $('app').hidden=false; bootApp_(); } }
    var wait = setInterval(function(){
      if (window.google && google.accounts && google.accounts.id){
        clearInterval(wait);
        google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true });
        google.accounts.id.renderButton($('gbtn'), { theme:'filled_blue', size:'large', text:'signin_with', shape:'pill' });
        if($('rebtn')) google.accounts.id.renderButton($('rebtn'), { theme:'filled_blue', size:'medium', text:'signin_with', shape:'pill' });
        if(!sessionAlive_()){ try{ google.accounts.id.prompt(); }catch(e){} }
      }
    }, 100);
  };
  function onCredential(resp){ authenticate_(resp.credential); }
  /* Google IDトークンをGASへ送り、セッショントークンを受け取る */
  function authenticate_(googleToken){
    return fetch(CONFIG.GAS_API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ action:'auth', idToken:googleToken }), redirect:'follow' })
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.ok && j.session){
          var prevEmail = SESSION_PL ? SESSION_PL.email : '';
          var wasReady = APP_READY;
          setSession_(j.session);
          $('signin').hidden=true; $('app').hidden=false; $('relogin').hidden=true;
          bootApp_();
          if(wasReady && j.email && j.email !== prevEmail) refreshInit_();   // ユーザー切替: 新ユーザーの担当者/既定を再取得(通常の無操作更新では再取得しない=タブ維持)
          if(pendingAuth_) pendingAuth_.resolve(true);
          return true;
        }
        $('signinMsg').textContent = (j&&j.message) || 'サインインに失敗しました。';
        if(pendingAuth_) pendingAuth_.resolve(false);
        return false;
      })
      .catch(function(){ if(pendingAuth_) pendingAuth_.resolve(false); return false; });
  }

  /* ===== 初期化(サインイン成否に関わらず一度だけ) ===== */
  function bootApp_(){ if(APP_READY) return; APP_READY=true; initApp(); }
  function initApp(){
    for (var i=0;i<INIT_ROWS;i++) LINES.push(blankRow());
    renderRows();
    $('addBtn').addEventListener('click', function(){ for(var i=0;i<5;i++) LINES.push(blankRow()); renderRows(); });
    $('clearBtn').addEventListener('click', function(){ LINES=[]; for(var i=0;i<INIT_ROWS;i++) LINES.push(blankRow()); renderRows(); setResult('',''); });
    $('submitBtn').addEventListener('click', submit);
    $('staff').addEventListener('change', updateSubmitState);
    $('camStart').addEventListener('click', startCam);
    $('camStop').addEventListener('click', stopCam);
    $('tabMove').addEventListener('click', function(){ setMode('move'); });
    $('tabAdjust').addEventListener('click', function(){ setMode('adjust'); });
    $('tabCheck').addEventListener('click', function(){ setMode('check'); });
    $('tabCount').addEventListener('click', function(){ setMode('count'); });
    wireCheck(); wireCount();
    $('switchUser').addEventListener('click', switchUser_);
    $('blindToggle').addEventListener('change', renderCounts);
    $('countClear').addEventListener('click', function(){ COUNTS=[]; renderCounts(); });
    // セッション維持: 25分ごと & タブ復帰時に軽量ping(操作していなくても失効させない/先回り再認証)
    setInterval(function(){ if(!document.hidden && SESSION) apiRaw_('touch',{}).catch(function(){}); }, 25*60*1000);
    document.addEventListener('visibilitychange', function(){
      if(document.hidden || !SESSION) return;
      apiRaw_('touch',{}).then(function(j){ if(j && j.code==='AUTH') trySilentReauth_().then(function(ok){ if(!ok) handleAuthLost_(); }); });
    });
    api('init', {}).then(onInit).catch(function(e){ setWhoRow('初期化に失敗: '+e, true); });
  }
  function onInit(d){
    if (d && d.code==='AUTH') return;   // 失効時は handleAuthLost_ 側で再サインイン誘導(画面は保持)
    if (d.today) $('tdate').value = d.today;
    if (!d.connected){ CONNECTED=false; setWhoRow('Salesforce未接続: '+(d.message||''), true); updateSubmitState(); return; }
    CONNECTED = true;
    var opt=function(sp){ return '<option value="'+sp.id+'">'+esc(sp.name)+'</option>'; };
    $('origin').innerHTML = d.stockPlaces.map(opt).join('');
    $('dest').innerHTML   = d.stockPlaces.map(opt).join('');
    if (d.defaultOriginId) $('origin').value=d.defaultOriginId;
    if (d.defaultDestId)   $('dest').value=d.defaultDestId;
    // 棚卸: 在庫場所プルダウン + 既定(勤務地の在庫置場) + カウント担当者
    MYINFO = { staffId:d.myStaffId||'', name:d.myName||'', workPlace:d.myWorkPlace||'' };
    $('countPlace').innerHTML = d.stockPlaces.map(opt).join('');
    if (d.defaultPlaceId) $('countPlace').value=d.defaultPlaceId;
    $('counterName').textContent = d.myName ? (d.myName + (d.myWorkPlace?(' ／ '+d.myWorkPlace):'')) : '(Googleログイン者)';
    var opts = '<option value="">選択してください</option>' + d.staff.map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+'</option>'; }).join('');
    if (d.myStaffId && d.staff.every(function(s){ return s.id!==d.myStaffId; })) opts += '<option value="'+d.myStaffId+'">'+esc(d.myName)+'</option>';
    $('staff').innerHTML = opts;
    if (d.myStaffId){ $('staff').value=d.myStaffId; $('staff').disabled=true; setWhoRow('担当者(自動選択・固定): '+d.myName + (d.myWorkPlace?('  ／ 勤務地: '+d.myWorkPlace):'')); }
    else { $('staff').disabled=false; setWhoRow('担当者が未登録です。手動で選択してください。'); }
    setMode('move');
  }
  function setWhoRow(m, ng){ var w=$('whoRow'); w.textContent=m; w.style.color = ng?'var(--ng)':'var(--mut)'; }

  /* ===== 明細表(手入力検索) ===== */
  function renderRows(){
    var tb=$('rows');
    tb.innerHTML = LINES.map(function(l,i){
      return '<div class="lrow">'
        + '<div class="lrow-top">'
          + '<span class="lno">'+(i+1)+'</span>'
          + '<div class="searchbox"><input class="iteminput" data-i="'+i+'" autocomplete="off" placeholder="品目コード/名称で検索" value="'+esc(l.code||'')+'"><div class="suggest" data-sug="'+i+'"></div></div>'
          + '<button class="btn x" data-clear="'+i+'" title="行をクリア">×</button>'
        + '</div>'
        + '<div class="lrow-bot">'
          + '<span class="iname" data-name="'+i+'">'+esc(l.name||'')+'</span>'
          + '<span class="qtybox">数量 <input class="qtyinput" type="number" min="1" step="1" data-i="'+i+'" value="'+esc(l.qty)+'"></span>'
        + '</div>'
      + '</div>';
    }).join('');
    tb.querySelectorAll('input.iteminput').forEach(function(inp){ var i=+inp.dataset.i;
      inp.addEventListener('input', function(){ onItemInput(i, inp); });
      inp.addEventListener('focus', function(){ if((inp.value||'').trim()) doSearch(i, inp); });
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); if(LINES[i]._cand&&LINES[i]._cand.length) pickItem(i, LINES[i]._cand[0]); } else if(e.key==='Escape'){ hideSug(i); } });
      inp.addEventListener('blur', function(){ setTimeout(function(){ hideSug(i); }, 200); });
    });
    tb.querySelectorAll('input.qtyinput').forEach(function(inp){ var i=+inp.dataset.i; inp.addEventListener('input', function(){ LINES[i].qty=inp.value; updateSummary(); updateSubmitState(); }); });
    tb.querySelectorAll('button[data-clear]').forEach(function(b){ b.addEventListener('click', function(){ clearRow(+b.dataset.clear); }); });
    updateSummary(); updateSubmitState();
  }
  function sugEl(i){ return document.querySelector('.suggest[data-sug="'+i+'"]'); }
  function nameCell(i){ return document.querySelector('.iname[data-name="'+i+'"]'); }
  function hideSug(i){ var s=sugEl(i); if(s) s.style.display='none'; }
  function doSearch(i, inp){ var t=(inp.value||'').trim(); if(!t){ hideSug(i); return; } if(timers[i]) clearTimeout(timers[i]); timers[i]=setTimeout(function(){ api('searchItems',{term:t}).then(function(res){ renderSug(i, inp, res.items||[]); }).catch(function(){ hideSug(i); }); }, 230); }
  function onItemInput(i, inp){ LINES[i].itemId=''; LINES[i].name=''; LINES[i].code=''; var nc=nameCell(i); if(nc) nc.textContent=''; updateSubmitState(); doSearch(i, inp); }
  function renderSug(i, inp, items){ LINES[i]._cand=items||[]; var s=sugEl(i); if(!s) return; if(!items.length){ s.innerHTML='<div class="muted" style="cursor:default">該当なし</div>'; s.style.display='block'; return; } s.innerHTML=items.map(function(it,k){ return '<div data-k="'+k+'"><span class="code">'+esc(it.code)+'</span>'+esc(it.name)+'</div>'; }).join(''); s.querySelectorAll('div[data-k]').forEach(function(el){ el.addEventListener('mousedown', function(ev){ ev.preventDefault(); pickItem(i, items[+el.dataset.k]); }); }); s.style.display='block'; }
  function pickItem(i, it){ if(!it) return; LINES[i].itemId=it.id; LINES[i].code=it.code; LINES[i].name=it.name; if(!LINES[i].qty||Number(LINES[i].qty)<=0) LINES[i].qty=1; var inp=document.querySelector('input.iteminput[data-i="'+i+'"]'); if(inp) inp.value=it.code; var nc=nameCell(i); if(nc) nc.textContent=it.name; var q=document.querySelector('input.qtyinput[data-i="'+i+'"]'); if(q) q.value=LINES[i].qty; hideSug(i); if(q) q.focus(); updateSummary(); updateSubmitState(); }
  function clearRow(i){ LINES[i]=blankRow(); var inp=document.querySelector('input.iteminput[data-i="'+i+'"]'); if(inp) inp.value=''; var q=document.querySelector('input.qtyinput[data-i="'+i+'"]'); if(q) q.value=''; var nc=nameCell(i); if(nc) nc.textContent=''; hideSug(i); updateSummary(); updateSubmitState(); }
  function validRows(){ return LINES.filter(function(l){ return l.itemId && Number(l.qty)>0; }); }
  function updateSummary(){ var v=validRows(); var q=v.reduce(function(a,l){return a+(Number(l.qty)||0);},0); $('summary').textContent = v.length ? (v.length+'品目 / 合計数量 '+q) : ''; }
  function updateSubmitState(){ $('submitBtn').disabled = !(CONNECTED && validRows().length>0 && $('staff').value); }

  /* ===== ライブスキャン(ZXing) ===== */
  var camStream = null, scanLoop = null, camActive = false, scanned_ = false;
  function buildHints(){ var h=new Map(); h.set(ZXing.DecodeHintType.TRY_HARDER, true); h.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.DATA_MATRIX,ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.CODE_93,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.ITF,ZXing.BarcodeFormat.CODABAR]); return h; }
  function startCam(){
    if(!window.ZXing){ setScanMsg('デコーダ読込中… 数秒後に再度'); return; }
    $('camwrap').style.display='block'; $('camStart').hidden=true; $('camStop').hidden=false; setScanMsg('QRは白枠に/横長バーコードは画面いっぱいに大きく・水平に写してください…');
    camActive = true; scanned_ = false;
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } } })
      .then(function(stream){ camStream=stream; var v=$('video'); v.srcObject=stream; v.setAttribute('playsinline',''); if(v.play) v.play().catch(function(){}); setupZoom_(stream.getVideoTracks()[0]); loopScan_(); })
      .catch(function(e){ closeCam_(); setScanMsg('カメラを起動できませんでした: '+(e&&e.name||e)); });
  }
  function loopScan_(){
    var reader=new ZXing.MultiFormatReader(), hints=buildHints();
    var canvas=document.createElement('canvas'), ctx=canvas.getContext('2d');
    var v=$('video');
    function decodeRegion(sx,sy,sw,sh){
      try{
        if(canvas.width!==sw||canvas.height!==sh){ canvas.width=sw; canvas.height=sh; }
        ctx.drawImage(v, sx,sy,sw,sh, 0,0,sw,sh);
        var src=new ZXing.HTMLCanvasElementLuminanceSource(canvas);
        var res=reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src)), hints);
        return res ? res.getText() : null;
      }catch(e){ return null; }
    }
    function tick(){
      if(!camActive) return;
      if(v.readyState>=2 && v.videoWidth){
        var vw=v.videoWidth, vh=v.videoHeight;
        // (1) 中央の横帯(全幅)=横長の1Dバーコード向け(両端を切らない)
        var t = decodeRegion(0, Math.floor(vh*0.28), vw, Math.floor(vh*0.44));
        // (2) 中央正方形=小さいQR向けソフトズーム
        if(!t){ var side=Math.floor(Math.min(vw,vh)*0.62); t=decodeRegion(Math.floor((vw-side)/2),Math.floor((vh-side)/2),side,side); }
        if(t && !scanned_){ scanned_=true; closeCam_(); onScan(t); return; }
      }
      scanLoop=setTimeout(tick, 130);
    }
    tick();
  }
  function stopCam(){ closeCam_(); setScanMsg('停止しました。'); }
  function closeCam_(){ camActive=false; if(scanLoop){ clearTimeout(scanLoop); scanLoop=null; } $('zoomWrap').style.display='none'; $('camStart').hidden=false; $('camStop').hidden=true; $('camwrap').style.display='none'; if(camStream){ camStream.getTracks().forEach(function(t){ try{t.stop();}catch(e){} }); camStream=null; } var vv=$('video'); if(vv) vv.srcObject=null; }
  function setupZoom_(track){
    try{
      if(!track || !track.getCapabilities){ $('zoomWrap').style.display='none'; return; }
      var caps=track.getCapabilities(); var any=false;
      // ズームは常に一番引いた状態(最小=最広角)に固定。スライダーは出さない
      if(caps && caps.zoom && caps.zoom.min!=null){ track.applyConstraints({advanced:[{zoom:caps.zoom.min}]}).catch(function(){}); }
      var torchOk = caps && caps.torch; var tb=$('torchBtn');
      tb.style.display = torchOk?'':'none';
      if(torchOk){ any=true; tb._on=false; tb.onclick=function(){ tb._on=!tb._on; track.applyConstraints({advanced:[{torch:!!tb._on}]}).catch(function(){}); }; }
      $('zoomWrap').style.display = any?'flex':'none';
    }catch(e){}
  }
  function setScanMsg(m){ $('scanMsg').textContent=m; }
  function beep(){ try{ var c=new (window.AudioContext||window.webkitAudioContext)(); var o=c.createOscillator(),g=c.createGain(); o.connect(g); g.connect(c.destination); o.frequency.value=880; g.gain.value=0.05; o.start(); setTimeout(function(){o.stop();c.close();},110); }catch(e){} }
  function onScan(text){ text=(text||'').trim(); if(!text) return; var now=Date.now(); if(text===lastScan.code && (now-lastScan.t)<2500) return; lastScan={code:text,t:now}; beep(); setScanMsg('読取: '+text+' → 照合中…'); api('resolveCode',{code:text, materialOnly: MODE==='count'}).then(onResolved).catch(function(e){ setScanMsg('エラー: '+e); }); }
  function onResolved(res){ hidePick(); if(res && res.ok===false && res.message){ setScanMsg(res.message); return; } if(!res||!res.items||!res.items.length){ setScanMsg('該当なし: '+((res&&res.scanned)||'')+'(未登録の可能性)'); return; } if(res.items.length===1){ var it=res.items[0]; handlePicked(it); setScanMsg((MODE==='check'?'在庫照会: ':'✓ 追加: ')+it.code+' '+it.name+(res.scanned!==it.code?'（旧 '+res.scanned+'）':'')); return; } setScanMsg('旧コード '+res.scanned+' は複数の新品目に対応。選択してください:'); showPick(res.items); }
  function handlePicked(it){ if(!it) return; if(MODE==='check'){ doCheck(it); } else if(MODE==='count'){ addCountLine(it); } else { fillTopEmpty(it); } }
  function fillTopEmpty(it){ var i=-1; for(var k=0;k<LINES.length;k++){ if(!LINES[k].itemId){ i=k; break; } } if(i<0){ LINES.push(blankRow()); renderRows(); i=LINES.length-1; } LINES[i].itemId=it.id; LINES[i].code=it.code; LINES[i].name=it.name; if(!LINES[i].qty||Number(LINES[i].qty)<=0) LINES[i].qty=1; var inp=document.querySelector('input.iteminput[data-i="'+i+'"]'); if(inp) inp.value=it.code; var nc=nameCell(i); if(nc) nc.textContent=it.name; var q=document.querySelector('input.qtyinput[data-i="'+i+'"]'); if(q) q.value=LINES[i].qty; updateSummary(); updateSubmitState(); }
  function showPick(items){ var el=$('scanPick'); el.innerHTML=items.map(function(it,k){ return '<div data-pk="'+k+'" style="padding:10px;border-top:1px solid #eef0f4;cursor:pointer"><span class="code">'+esc(it.code)+'</span>'+esc(it.name)+'</div>'; }).join(''); el.querySelectorAll('div[data-pk]').forEach(function(d){ d.addEventListener('click', function(){ var it=items[+d.dataset.pk]; handlePicked(it); setScanMsg((MODE==='check'?'在庫照会: ':'✓ 追加: ')+it.code+' '+it.name); hidePick(); }); }); el.style.display='block'; }
  function hidePick(){ $('scanPick').style.display='none'; }

  /* ===== 在庫確認タブ ===== */
  var checkTimer=null, checkCand=[];
  function wireCheck(){
    var inp=$('checkInput'); if(!inp) return;
    inp.addEventListener('input', function(){ var t=(inp.value||'').trim(); if(!t){ hideCheckSug(); return; } if(checkTimer)clearTimeout(checkTimer); checkTimer=setTimeout(function(){ api('searchItems',{term:t}).then(function(res){ renderCheckSug(res.items||[]); }).catch(function(){ hideCheckSug(); }); },230); });
    inp.addEventListener('focus', function(){ if((inp.value||'').trim() && checkCand.length){ $('checkSug').style.display='block'; } });
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); if(checkCand.length) doCheck(checkCand[0]); } else if(e.key==='Escape'){ hideCheckSug(); } });
    inp.addEventListener('blur', function(){ setTimeout(hideCheckSug,200); });
  }
  function renderCheckSug(items){ checkCand=items||[]; var s=$('checkSug'); if(!s) return; if(!items.length){ s.innerHTML='<div class="muted" style="cursor:default">該当なし</div>'; s.style.display='block'; return; } s.innerHTML=items.map(function(it,k){ return '<div data-ck="'+k+'"><span class="code">'+esc(it.code)+'</span>'+esc(it.name)+'</div>'; }).join(''); s.querySelectorAll('div[data-ck]').forEach(function(el){ el.addEventListener('mousedown', function(ev){ ev.preventDefault(); doCheck(items[+el.dataset.ck]); }); }); s.style.display='block'; }
  function hideCheckSug(){ var s=$('checkSug'); if(s) s.style.display='none'; }
  function doCheck(it){ if(!it) return; if(MODE!=='check') setMode('check'); var inp=$('checkInput'); if(inp) inp.value=it.code; hideCheckSug(); $('checkResult').innerHTML='<div class="muted">照会中…</div>'; api('getStock',{itemId:it.id}).then(function(res){ if(res && res.ok){ renderStock(it, res.rows||[]); } else { $('checkResult').innerHTML='<div class="banner ng">'+esc((res&&res.message)||'取得に失敗しました')+'</div>'; } }).catch(function(e){ $('checkResult').innerHTML='<div class="banner ng">エラー: '+esc(String(e))+'</div>'; }); }
  function fmt(n){ if(n==null||n==='') return '-'; var x=Number(n); return isNaN(x)?esc(n):x.toLocaleString('ja-JP'); }
  function renderStock(it, rows){
    var el=$('checkResult');
    var head='<div style="margin-bottom:8px"><span class="code">'+esc(it.code)+'</span>'+esc(it.name)+'</div>';
    if(!rows.length){ el.innerHTML=head+'<div class="banner warn">在庫はありません(在庫数量0 または在庫レコード無し)。</div>'; return; }
    var total=rows.reduce(function(a,r){return a+(Number(r.qty)||0);},0);
    var unit=rows[0].unit||'';
    var body=rows.map(function(r){ return '<tr><td>'+esc(r.place)+'</td><td style="text-align:right">'+fmt(r.qty)+'</td><td style="text-align:right">'+fmt(r.avail)+'</td><td class="iname">'+esc(r.lot||'')+'</td></tr>'; }).join('');
    el.innerHTML=head
      +'<div style="margin:4px 0 8px"><b>合計 '+fmt(total)+' '+esc(unit)+'</b> <span class="muted">('+rows.length+'ヶ所)</span></div>'
      +'<div style="overflow-x:auto"><table><thead><tr><th>在庫場所</th><th style="text-align:right">在庫数量</th><th style="text-align:right">有効在庫</th><th>ロット</th></tr></thead><tbody>'+body+'</tbody></table></div>';
  }

  /* ===== 棚卸タブ(カウント→差異。SF書き込みは次フェーズ) ===== */
  var countTimer=null, countCand=[];
  function wireCount(){
    var inp=$('countInput'); if(!inp) return;
    inp.addEventListener('input', function(){ var t=(inp.value||'').trim(); if(!t){ hideCountSug(); return; } if(countTimer)clearTimeout(countTimer); countTimer=setTimeout(function(){ api('searchItems',{term:t, materialOnly:true}).then(function(res){ renderCountSug(res.items||[]); }).catch(function(){ hideCountSug(); }); },230); });
    inp.addEventListener('focus', function(){ if((inp.value||'').trim() && countCand.length){ $('countSug').style.display='block'; } });
    inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); if(countCand.length) addCountLine(countCand[0]); } else if(e.key==='Escape'){ hideCountSug(); } });
    inp.addEventListener('blur', function(){ setTimeout(hideCountSug,200); });
  }
  function renderCountSug(items){ countCand=items||[]; var s=$('countSug'); if(!s) return; if(!items.length){ s.innerHTML='<div class="muted" style="cursor:default">該当なし(原材料のみ)</div>'; s.style.display='block'; return; } s.innerHTML=items.map(function(it,k){ return '<div data-nk="'+k+'"><span class="code">'+esc(it.code)+'</span>'+esc(it.name)+'</div>'; }).join(''); s.querySelectorAll('div[data-nk]').forEach(function(el){ el.addEventListener('mousedown', function(ev){ ev.preventDefault(); addCountLine(items[+el.dataset.nk]); }); }); s.style.display='block'; }
  function hideCountSug(){ var s=$('countSug'); if(s) s.style.display='none'; }
  function addCountLine(it){
    if(!it) return;
    var placeId=$('countPlace').value;
    if(!placeId){ setScanMsg('先に棚卸する在庫場所を選んでください。'); return; }
    var ci=$('countInput'); if(ci) ci.value=''; hideCountSug();
    for(var k=0;k<COUNTS.length;k++){ if(COUNTS[k].itemId===it.id){ var ex=document.querySelector('input.countinput[data-ci="'+k+'"]'); if(ex){ ex.focus(); ex.select(); } setScanMsg('既に一覧にあります: '+it.code+' '+it.name); return; } }
    api('stocktakeStock',{itemId:it.id, placeId:placeId}).then(function(res){
      var sys=(res&&res.ok)?(Number(res.sysQty)||0):0; var unit=(res&&res.unit)||'';
      COUNTS.unshift({ itemId:it.id, code:it.code, name:it.name, sys:sys, unit:unit, count:'' });
      renderCounts();
      var q=document.querySelector('input.countinput[data-ci="0"]'); if(q) q.focus();
    }).catch(function(e){ setScanMsg('在庫取得エラー: '+e); });
  }
  function renderCounts(){
    var blind=$('blindToggle').checked;
    var tb=$('countRows');
    tb.innerHTML = COUNTS.map(function(c,i){
      var sysCell = blind ? '<span class="muted">(非表示)</span>' : (fmt(c.sys)+' '+esc(c.unit));
      return '<div class="lrow">'
        + '<div class="lrow-top"><span class="lno">'+(i+1)+'</span>'
          + '<span style="flex:1"><span class="code">'+esc(c.code)+'</span>'+esc(c.name)+'</span>'
          + '<button class="btn x" data-cdel="'+i+'" title="行を削除">×</button></div>'
        + '<div class="lrow-bot" style="flex-wrap:wrap;gap:8px 14px">'
          + '<span class="qtybox">システム '+sysCell+'</span>'
          + '<span class="qtybox">実数 <input class="countinput qtyinput" type="number" min="0" step="1" inputmode="numeric" data-ci="'+i+'" value="'+esc(c.count)+'"></span>'
          + '<span class="qtybox">差異 <b data-diff="'+i+'" style="color:var(--mut)"></b></span>'
        + '</div></div>';
    }).join('');
    tb.querySelectorAll('input.countinput').forEach(function(inp){ var i=+inp.dataset.ci; inp.addEventListener('input', function(){ COUNTS[i].count=inp.value; updateCountRow(i); updateCountSummary(); }); });
    tb.querySelectorAll('button[data-cdel]').forEach(function(b){ b.addEventListener('click', function(){ COUNTS.splice(+b.dataset.cdel,1); renderCounts(); }); });
    COUNTS.forEach(function(_,i){ updateCountRow(i); });
    updateCountSummary();
  }
  function updateCountRow(i){
    var c=COUNTS[i]; if(!c) return; var blind=$('blindToggle').checked;
    var el=document.querySelector('b[data-diff="'+i+'"]'); if(!el) return;
    if(blind){ el.textContent='－'; el.style.color='var(--mut)'; return; }
    if(c.count===''||c.count==null){ el.textContent=''; return; }
    var d=(Number(c.count)||0)-c.sys; el.textContent=(d>0?'+':'')+fmt(d); el.style.color=(d===0?'var(--ok)':'var(--ng)');
  }
  function updateCountSummary(){
    var blind=$('blindToggle').checked;
    var entered=COUNTS.filter(function(c){ return c.count!=='' && c.count!=null; }).length;
    var diffs=COUNTS.filter(function(c){ return c.count!=='' && c.count!=null && (Number(c.count)||0)!==c.sys; }).length;
    $('countSummary').textContent = COUNTS.length ? (COUNTS.length+'品目 / 実数入力 '+entered + (blind?'':(' / 差異 '+diffs))) : '';
  }

  /* ===== 送信 ===== */
  function submit(){
    if(!$('staff').value){ setResult('担当者を選択してください。','ng'); return; }
    var v=validRows(); if(!v.length){ setResult('品目と数量のある行がありません。','ng'); return; }
    var lines = v.map(function(l){ return { itemId:l.itemId, qty:Number(l.qty) }; });
    if(MODE==='adjust'){
      $('submitBtn').disabled=true; setResult('引き落とし中…','');
      var pa={ header:{ placeId:$('origin').value, date:$('tdate').value, staffId:$('staff').value }, lines:lines };
      api('submitAdjust',{payload:pa}).then(function(res){ onSubmit(res,'引き落とし'); }).catch(function(e){ setResult('エラー: '+e,'ng'); updateSubmitState(); });
    } else {
      if($('origin').value===$('dest').value){ setResult('移管元と移管先が同じです。','ng'); return; }
      $('submitBtn').disabled=true; setResult('登録中…','');
      var pm={ header:{ originId:$('origin').value, destId:$('dest').value, date:$('tdate').value, staffId:$('staff').value }, lines:lines };
      api('submit',{payload:pm}).then(function(res){ onSubmit(res,'移管'); }).catch(function(e){ setResult('エラー: '+e,'ng'); updateSubmitState(); });
    }
  }
  function onSubmit(res, label){
    label = label || '移管';
    if(res.ok){ setResult('✓ '+res.count+'件を一括'+label+'しました(在庫更新済み)。','ok'); LINES=[]; for(var i=0;i<INIT_ROWS;i++) LINES.push(blankRow()); renderRows(); }
    else if(res.message){ setResult(label+'できませんでした: '+res.message,'ng'); }
    else { var m=(res.errors||[]).map(function(e){ return '行'+e.row+': '+(e.errors||[]).map(function(x){return x.message||JSON.stringify(x);}).join('; '); }); setResult('一部エラー: '+m.join(' / '),'ng'); }
    updateSubmitState();
  }
  function setResult(m,c){ var r=$('result'); r.textContent=m; r.className='result '+(c||''); }
</script>
